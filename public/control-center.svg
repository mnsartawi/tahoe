  <path d="M4.6 3.2H6.4A1.4 1.4 0 0 1 6.4 6H4.6A1.4 1.4 0 0 1 4.6 3.2Z"/>
  <path fill-rule="evenodd" d="M4.6 8.6H11.4A2.8 2.8 0 0 1 11.4 14.2H4.6A2.8 2.8 0 0 1 4.6 8.6ZM9.6 10H11.4A1.4 1.4 0 0 1 11.4 12.8H9.6A1.4 1.4 0 0 1 9.6 10Z"/>
