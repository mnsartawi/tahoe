<!-- Control Center menu-bar glyph (two stacked toggle switches), recreation of macOS Tahoe 26.
     16x16 grid, ~12.4 x 12.4 ink. Upper: outlined pill, knob leading. Lower: filled pill, knob knocked out
     (even-odd, so the background shows through). Transparent background; fill is currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
